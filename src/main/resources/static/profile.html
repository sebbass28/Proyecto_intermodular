<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Tienda Online</title>
    <link href="estilo.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .profile-name {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .profile-email {
            color: #666;
            font-size: 1.1rem;
        }

        .profile-sections {
            display: grid;
            gap: 2rem;
        }

        .profile-section {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 15px;
            border-left: 4px solid #667eea;
        }

        .section-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .profile-info {
            display: grid;
            gap: 1rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: white;
            border-radius: 10px;
            border: 1px solid #e1e5e9;
        }

        .info-label {
            font-weight: 600;
            color: #333;
        }

        .info-value {
            color: #666;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e1e5e9;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            .profile-container {
                margin: 1rem;
                padding: 1rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-heart"></i> Peluches Paradise
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">
                        <i class="fas fa-home"></i> Inicio
                    </a></li>
                    <li><a href="index.html#productos">
                        <i class="fas fa-toys"></i> Productos
                    </a></li>
                    <li><a href="index.html#carrito">
                        <i class="fas fa-shopping-cart"></i> Carrito
                    </a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="user-section" id="user-section">
                    <!-- Se llenará dinámicamente -->
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="profile-container">
            <div id="loading" class="loading">
                <i class="fas fa-spinner fa-spin"></i> Cargando perfil...
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>

            <div id="profile-content" style="display: none;">
                <div class="profile-header">
                    <div class="profile-avatar" id="profile-avatar">
                        <!-- Se llenará con iniciales -->
                    </div>
                    <div class="profile-name" id="profile-name"></div>
                    <div class="profile-email" id="profile-email"></div>
                </div>

                <div class="profile-sections">
                    <div class="profile-section">
                        <h3 class="section-title">
                            <i class="fas fa-user"></i> Información Personal
                        </h3>
                        <div class="profile-info">
                            <div class="info-row">
                                <span class="info-label">Nombre:</span>
                                <span class="info-value" id="info-nombre"></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Apellido:</span>
                                <span class="info-value" id="info-apellido"></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Email:</span>
                                <span class="info-value" id="info-email"></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Teléfono:</span>
                                <span class="info-value" id="info-telefono"></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Dirección:</span>
                                <span class="info-value" id="info-direccion"></span>
                            </div>
                        </div>
                    </div>

                    <div class="profile-section">
                        <h3 class="section-title">
                            <i class="fas fa-chart-bar"></i> Estadísticas
                        </h3>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-number" id="stat-compras">0</div>
                                <div class="stat-label">Compras Realizadas</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number" id="stat-carrito">0</div>
                                <div class="stat-label">Items en Carrito</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number" id="stat-favoritos">0</div>
                                <div class="stat-label">Productos Favoritos</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <a href="index.html" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Volver a la Tienda
                    </a>
                    <button class="btn btn-primary" onclick="editProfile()">
                        <i class="fas fa-edit"></i> Editar Perfil
                    </button>
                    <button class="btn btn-danger" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="profile.js"></script>
</body>
</html>
